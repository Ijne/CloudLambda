---
- name: Deploy CloudFunction
  hosts: cloudfunctions
  become: true

  vars:
    go_version: "1.22.3"
    go_archive: "go{{ go_version }}.linux-amd64.tar.gz"
    go_url: "https://go.dev/dl/{{ go_archive }}"
    kafka_version: "4.3.1"
    kafka_scala: "2.13"
    kafka_dir: "/opt/kafka"

  tasks:

    # --- Системные пакеты ---

    - name: Install system packages
      apt:
        name:
          - curl
          - git
          - bash
          - ca-certificates
          - openjdk-21-jre-headless
          - python3-psycopg2
          - python3
          - golang-go
        state: present
        update_cache: true

    # --- Go ---

    - name: Check Go installed
      stat:
        path: /usr/local/go/bin/go
      register: go_bin

    - name: Download Go
      get_url:
        url: "{{ go_url }}"
        dest: "/tmp/{{ go_archive }}"
      when: not go_bin.stat.exists

    - name: Install Go
      unarchive:
        src: "/tmp/{{ go_archive }}"
        dest: /usr/local
        remote_src: true
      when: not go_bin.stat.exists

    - name: Add Go to PATH
      copy:
        dest: /etc/profile.d/go.sh
        content: 'export PATH=$PATH:/usr/local/go/bin'
        mode: '0644'

    # --- PostgreSQL ---

    - name: Install PostgreSQL
      apt:
        name:
          - postgresql
          - postgresql-client
        state: present

    - name: Start PostgreSQL
      systemd:
        name: postgresql
        state: started
        enabled: true

    - name: Create database user
      become_user: postgres
      community.postgresql.postgresql_user:
        name: cf
        password: cf
        state: present

    - name: Create database
      become_user: postgres
      community.postgresql.postgresql_db:
        name: cloudfunctions
        owner: cf
        state: present

    # --- Kafka (KRaft) ---

    - name: Check Kafka installed
      stat:
        path: "{{ kafka_dir }}"
      register: kafka_installed

    - name: Download Kafka
      get_url:
        url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_{{ kafka_scala }}-{{ kafka_version }}.tgz"
        dest: "/tmp/kafka.tgz"
      when: not kafka_installed.stat.exists

    - name: Extract Kafka
      unarchive:
        src: /tmp/kafka.tgz
        dest: /opt
        remote_src: true
      when: not kafka_installed.stat.exists

    - name: Symlink Kafka directory
      file:
        src: "/opt/kafka_{{ kafka_scala }}-{{ kafka_version }}"
        dest: "{{ kafka_dir }}"
        state: link
      when: not kafka_installed.stat.exists

    - name: Generate Kafka cluster UUID
      command: "{{ kafka_dir }}/bin/kafka-storage.sh random-uuid"
      register: kafka_uuid
      changed_when: false

    - name: Stop Kafka before reformatting
      systemd:
        name: kafka
        state: stopped
      ignore_errors: true

    - name: Clean Kafka storage
      file:
        path: /tmp/kraft-combined-logs
        state: absent

    - name: Format Kafka storage (KRaft)
      command: "{{ kafka_dir }}/bin/kafka-storage.sh format --standalone -t {{ kafka_uuid.stdout }} -c {{ kafka_dir }}/config/server.properties"
      register: kafka_format
      changed_when: "'Formatting' in kafka_format.stdout"
      failed_when:
        - kafka_format.rc != 0
        - "'already formatted' not in kafka_format.stdout"

    - name: Copy Kafka systemd unit
      copy:
        dest: /etc/systemd/system/kafka.service
        mode: '0644'
        content: |
          [Unit]
          Description=Apache Kafka (KRaft)
          After=network.target

          [Service]
          Type=simple
          User=root
          ExecStart={{ kafka_dir }}/bin/kafka-server-start.sh {{ kafka_dir }}/config/server.properties
          ExecStop={{ kafka_dir }}/bin/kafka-server-stop.sh
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      systemd:
        daemon_reload: true

    - name: Start Kafka
      systemd:
        name: kafka
        state: restarted
        enabled: true

    - name: Wait for Kafka
      wait_for:
        host: localhost
        port: 9092
        timeout: 60

    - name: Wait for PostgreSQL
      wait_for:
        host: localhost
        port: 5432
        timeout: 60

    # --- Рантаймы ---

    - name: Create runtimes directory
      file:
        path: /var/cloudfunctions/runtimes
        state: directory
        mode: '0755'

    - name: Create functions directory
      file:
        path: /var/cloudfunctions/functions
        state: directory
        mode: '0755'

    - name: Run init.sh to prepare runtimes
      command: bash {{ project_dir }}/init.sh
      environment:
        ENV_ROOT: /var/cloudfunctions/runtimes

    # --- Сборка ---

    - name: Create bin directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ project_dir }}/api/bin"
        - "{{ project_dir }}/executor/bin"

    - name: Build API binary
      command: /usr/local/go/bin/go build -o {{ project_dir }}/api/bin/api .
      args:
        chdir: "{{ project_dir }}/api"

    - name: Build Executor binary
      command: /usr/local/go/bin/go build -o {{ project_dir }}/executor/bin/executor ./cmd
      args:
        chdir: "{{ project_dir }}/executor"

    # --- Systemd сервисы ---

    - name: Copy API service
      template:
        src: cloudfunctions-api.service
        dest: /etc/systemd/system/cloudfunctions-api.service

    - name: Copy Executor service
      template:
        src: cloudfunctions-executor.service
        dest: /etc/systemd/system/cloudfunctions-executor.service

    - name: Reload systemd
      systemd:
        daemon_reload: true

    - name: Enable and start API
      systemd:
        name: cloudfunctions-api
        state: restarted
        enabled: true

    - name: Enable and start Executor
      systemd:
        name: cloudfunctions-executor
        state: restarted
        enabled: true

    - name: Done
      debug:
        msg: "CloudFunction is running at http://localhost:8080"